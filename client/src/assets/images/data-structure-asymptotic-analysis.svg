<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" width="520" height="420" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Light grid -->
  <g stroke="#D9CFC0" stroke-width="1" stroke-dasharray="2 4">
    <line x1="50" y1="80" x2="495" y2="80"/>
    <line x1="50" y1="140" x2="495" y2="140"/>
    <line x1="50" y1="200" x2="495" y2="200"/>
    <line x1="50" y1="260" x2="495" y2="260"/>
    <line x1="50" y1="320" x2="495" y2="320"/>
  </g>

  <!-- Axes -->
  <g stroke="#3B2F25" stroke-width="2" fill="none">
    <line x1="50" y1="10" x2="50" y2="360"/>
    <line x1="50" y1="360" x2="495" y2="360"/>
  </g>

  <!-- n0 marker -->
  <line x1="147" y1="205" x2="147" y2="360" stroke="#3B2F25" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- c2*g(n): upper bound -->
  <path d="M50,360 C90,290 120,215 165,205 C175,203 182,206 192,204 C220,196 225,150 240,125 C265,85 320,70 400,45"
        fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round"/>

  <!-- c1*g(n): lower bound -->
  <path d="M50,360 C90,320 100,300 120,290 C140,280 150,282 165,280 C190,278 200,278 215,268 C240,250 260,235 290,222 C340,205 380,200 440,192"
        fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round"/>

  <!-- f(n): the function, highlighted in burnt orange -->
  <path d="M50,275 C90,275 120,272 135,290 C142,300 147,302 155,296 C185,265 230,200 280,180 C340,160 400,140 430,118"
        fill="none" stroke="#B8500F" stroke-width="3" stroke-linecap="round"/>

  <!-- Labels -->
  <g fill="#3B2F25" font-family="Helvetica, Arial, sans-serif" font-size="14">
    <text x="362" y="32">c<tspan baseline-shift="sub" font-size="10">2</tspan>g(n)</text>
    <text x="410" y="108" fill="#B8500F">f(n)</text>
    <text x="424" y="186">c<tspan baseline-shift="sub" font-size="10">1</tspan>g(n)</text>
    <text x="493" y="366" font-size="15" font-style="italic">n</text>
    <text x="131" y="378" font-size="14" font-style="italic">n<tspan baseline-shift="sub" font-size="10">0</tspan></text>
  </g>

  <!-- Caption -->
  <text x="260" y="402" text-anchor="middle" fill="#3B2F25"
        font-family="Helvetica, Arial, sans-serif" font-size="16">
    f(n) = Θ(g(n))
  </text>
</svg>
